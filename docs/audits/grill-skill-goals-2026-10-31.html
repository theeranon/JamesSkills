<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grill Me</title>
<style>:root{--ink:#172033;--muted:#667085;--line:#d8dee8;--soft:#eef1f5;--blue:#2563eb;--tint:#edf3ff;--good:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;line-height:1.4}.shell{max-width:880px;margin:auto;padding:18px}header{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font-size:24px;line-height:1.2;margin:0}.meta,.status{font-size:13px;color:var(--muted)}.bar{height:6px;background:#dce1e8;border-radius:6px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:.2s}.q{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}.q h2{font-size:17px;margin:0 0 4px}.body{font-size:14px;color:#344054;margin-bottom:10px}.opts{display:grid;gap:7px}.opt{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer}.opt:hover{border-color:#8fb0f7}.opt.on{border-color:var(--blue);background:var(--tint)}.opt input{margin-top:3px}.lab{font-weight:600}.desc{font-size:13px;color:var(--muted)}.rec{font-size:11px;color:var(--blue);font-weight:700}.tools,.footer{display:flex;gap:7px}.tools{margin-bottom:8px}button{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 12px;font:inherit;font-weight:600;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:64px;margin-top:9px;border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;resize:vertical}.footer{position:sticky;bottom:0;background:#eef1f5f2;padding:10px 0;justify-content:flex-end}.status{margin-right:auto;align-self:center}.done{color:var(--good);font-weight:700}@media(max-width:600px){.shell{padding:10px}header{align-items:start;flex-direction:column}.opt{grid-template-columns:22px 1fr}.rec{grid-column:2}.footer{flex-wrap:wrap}.status{width:100%}}</style></head>
<body><main class="shell"><header><div><h1 id="title"></h1><div class="meta" id="round"></div></div><div class="meta">คำตอบอยู่ในเครื่องนี้เท่านั้น</div></header><div class="bar"><i id="fill"></i></div><div id="questions"></div><div class="footer"><span class="status" id="status"></span><button id="next">ข้อที่ยังไม่ตอบ</button><button class="primary" id="copy" disabled>คัดลอกคำตอบ</button><button id="download" disabled>ดาวน์โหลด JSON</button></div></main>
<script>const D={"title": "Grill Me: เป้าหมายของสกิลที่เหลือ (ตอบ offline ได้)", "round": 2, "questions": [{"id": "hand_it_off", "title": "hand-it-off", "body": "ถามเพราะ hand-it-off จ่ายค่า description ทุก turn ทุก host เพื่อบอกว่า \"อย่าเลือก\" และหน้าที่จริงของมันคือ Candidate Card gate (กฎใน AGENTS.md) ไม่ใช่งานที่คุณเรียกใช้ คำตอบตัดสินว่ามันควรเป็นสกิลที่ติดตั้งอยู่ไหม", "type": "single", "recommended": [], "options": [{"id": "doc_only", "label": "ย้ายไปเป็นกฎใน AGENTS.md/docs", "description": "ไม่ติดตั้งเป็นสกิล; Candidate Card gate อยู่ในเอกสาร repo; ประหยัด listing budget ทุก host"}, {"id": "keep_hidden", "label": "คงไว้แต่ซ่อนจากคน", "description": "ติดตั้งเป็นสกิลที่ model เรียกได้อย่างเดียว (user-invocable: false) เผื่อ auto-routing บน host ที่รองรับ"}, {"id": "keep_as_is", "label": "คงไว้เหมือนเดิม", "description": "เป็น fallback router ที่คนและ model เห็น"}], "detailPrompt": "ถ้ามีกรณีที่คุณเคยอยากเรียกมันเอง เล่าให้ฟัง"}, {"id": "catchup_vs_standard", "title": "catchup vs project-standard", "body": "ถามเพราะทั้งสองทำงานกับ project contract เดียวกัน: catchup อ่านสถานะจริงหลังหายไป (read-only) project-standard สร้าง/ซ่อม contract ตอนคุณพิมพ์ \"ถึงไหนแล้ว\" คุณคาดหวังอะไรเมื่อสถานะในไฟล์ล้าสมัย", "type": "single", "recommended": [], "options": [{"id": "report_only", "label": "รายงานความจริง ชี้ว่าไฟล์ล้าสมัย ไม่แก้", "description": "ตามไฟล์ปัจจุบัน: catchup read-only แล้วแนะนำ project-standard แยกต่างหาก"}, {"id": "report_and_fix", "label": "รายงานแล้วซ่อม STATUS ให้ตรงเลย", "description": "catchup อัปเดต STATUS.md เองเมื่อหลักฐานชัด ไม่ต้องเรียกสกิลที่สอง"}, {"id": "report_and_continue", "label": "รายงานแล้วทำงานค้างต่อทันที", "description": "catchup เป็นแค่ขั้นแรกของ \"ทำต่อจากเดิม\" แล้วลงมือเลยตาม proactive-habits"}]}, {"id": "output_trio", "title": "final-it / one-page-pls / sum-meet", "body": "ถามเพราะสามตัวนี้แยกตามรูปแบบ artifact และกฎ format (HTML-only, PDF ต้องขอ) ถูกเขียนซ้ำ 5 ที่ ตอนคุณพิมพ์ \"ทำให้พร้อมส่ง\" โดยไม่บอกรูปแบบ คุณคาดหวังอะไร", "type": "single", "recommended": [], "options": [{"id": "ai_picks", "label": "AI เลือกรูปแบบจากผู้รับเอง", "description": "ตามไฟล์ final-it: เลือก format ที่รับใช้ผู้รับ Markdown ถ้าภาพไม่ช่วย"}, {"id": "house_html", "label": "ได้ HTML สไตล์บ้านเสมอ", "description": "ทุก deliverable ที่พร้อมส่งเป็น HTML A4 ตาม make-it-james-ux เว้นแต่ขอชัดว่าอย่างอื่น"}, {"id": "ask_first", "label": "ถามรูปแบบก่อนหนึ่งคำถาม", "description": "เมื่อไม่ระบุ ถามว่าจะส่งทางไหน แล้วค่อยทำ"}], "detailPrompt": "มีกรณีที่คุณต้องการ PDF โดยไม่อยากต้องพิมพ์คำว่า PDF ไหม"}, {"id": "coach_me", "title": "coach-me", "body": "ถามเพราะ DEC ก่อนหน้าเคาะให้ coach-me เป็น non-directive (ถามอย่างเดียว ไม่แนะนำ) และคุณบอกว่าทุกสกิลยังไม่ตรงใจ ตอนคุณพิมพ์ \"โค้ชหน่อย ตันแล้ว\" คุณต้องการอะไร", "type": "single", "recommended": [], "options": [{"id": "non_directive", "label": "ถามจนฉันเห็นเอง ไม่แนะนำ", "description": "ตามไฟล์ปัจจุบัน (Satir/MI) เปลี่ยนเป็นตอบตรงเมื่อฉันสั่ง"}, {"id": "coach_then_advise", "label": "ถาม 2-3 ข้อแล้วเสนอทางเลือกเลย", "description": "โค้ชสั้นๆ แล้วให้คำแนะนำพร้อมเหตุผล ไม่ลากยาว"}, {"id": "business_coach", "label": "โค้ชธุรกิจ: ท้าทาย+ให้ framework", "description": "ใช้ lens ใน baseon (Wealth Dynamics ฯลฯ) ท้าทายสมมติฐานและเสนอ move ถัดไป"}]}, {"id": "evidence_trio", "title": "research-it / give-me-solutions / baseon", "body": "ถามเพราะสามตัวนี้ทับกันเรื่องหลักฐาน: research-it ตัดสิน claim เดียว, give-me-solutions เทียบตัวเลือก, baseon ใช้ framework ที่ลงทะเบียน ตอนคุณพิมพ์ \"จริงเหรอ\" กับ \"ตัวไหนดีสุด\" คุณมองเป็นงานเดียวกันไหม", "type": "single", "recommended": [], "options": [{"id": "three_distinct", "label": "คนละงาน คงสามตัว", "description": "ตรวจความจริง / เลือกตัวเลือก / วิเคราะห์ด้วย framework แยกกันชัด"}, {"id": "merge_research_solutions", "label": "รวม research-it กับ give-me-solutions", "description": "ตัวเดียว: หาหลักฐานแล้วชี้ว่าควรเลือกอะไร; baseon แยกไว้"}, {"id": "baseon_is_mode", "label": "baseon ควรเป็น mode ไม่ใช่ workflow", "description": "เปิดแล้วทุกการวิเคราะห์ใช้ framework ที่ลงทะเบียนโดยอัตโนมัติ"}], "detailPrompt": "framework ที่คุณใช้บ่อยจริงใน 3 เดือนนี้คืออะไร"}, {"id": "never_again", "title": "never-again", "body": "ถามเพราะไฟล์กำหนดให้ทุก lesson ต้องมี 3 regression case และ pointer ใน contract ซึ่งหนักสำหรับความผิดพลาดเล็ก ตอนคุณพิมพ์ \"จำไว้เลย อย่าให้เกิดอีก\" คุณคาดหวังอะไร", "type": "single", "recommended": [], "options": [{"id": "full_lesson", "label": "lesson เต็มรูปแบบ + 3 case ทุกครั้ง", "description": "ตามไฟล์: กลไก, กฎ, regression 3 แบบ, pointer"}, {"id": "proportional", "label": "สั้นหรือยาวตามความเสียหาย", "description": "เรื่องเล็ก = 1 บรรทัดใน LESSONS; เรื่องซ้ำ/แพง = lesson เต็ม"}, {"id": "memory_first", "label": "จำใน memory ส่วนตัวก่อน", "description": "บันทึกเป็น memory/กฎส่วนตัวของ AI ก่อน; เข้า repo เมื่อเกิดซ้ำข้ามโปรเจกต์"}]}, {"id": "make_it_james_pair", "title": "make-it-james / make-it-james-ux", "body": "ถามเพราะทั้งคู่เป็น shared-standard ที่ควรทำงานเองอัตโนมัติ แต่คุณบอกว่าสกิลไม่ค่อยทำตาม งานที่คุณได้รับช่วงนี้ อะไรหลุดบ่อยสุด", "type": "multi", "recommended": [], "options": [{"id": "translated_thai", "label": "ภาษาไทยยังเหมือนแปล/มี metacopy", "description": "กฎ make-it-james ไม่ถูกใช้ตอนเขียนจริง"}, {"id": "layout_drift", "label": "layout/grid/สีไม่ตามโปรเจกต์", "description": "กฎ make-it-james-ux ไม่ถูกใช้หรือใช้ house default ทับระบบเดิม"}, {"id": "not_triggered", "label": "ไม่หลุดเรื่องคุณภาพ แต่ไม่ยอมโหลดเอง", "description": "ต้องเรียกชื่อสกิลถึงจะทำ แสดงว่าปัญหาคือ trigger ไม่ใช่เนื้อหา"}], "detailPrompt": "ยกตัวอย่างงานล่าสุดที่หลุด"}, {"id": "proactive_dev", "title": "proactive-dev", "body": "ถามเพราะคุณเคาะแล้วว่า proactive-habits เปิดตลอดและ insight ตั้งเป้า dev ได้ proactive-dev จึงเหลือหน้าที่อะไร", "type": "single", "recommended": [], "options": [{"id": "eng_discipline", "label": "วินัยวิศวกรรม: test, rollback, architecture", "description": "คงไว้เป็น mode สำหรับ build session; ไม่ยุ่งเรื่องตัดสินใจ/ถาม ซึ่งเป็นของ proactive-habits"}, {"id": "merge_into_habits", "label": "ยุบเข้า proactive-habits", "description": "ท่าทีเดียวครอบทั้งธุรกิจและโค้ด; กฎวิศวกรรมย้ายไป project-standard/dev-are-you-sure"}, {"id": "tech_lead", "label": "tech lead ที่วางแผนและแบ่งงาน subagent", "description": "เน้นวางแผน 5 roles และ delegation ตามไฟล์ปัจจุบัน"}]}, {"id": "footer_text", "title": "footer ใน one-page-pls / sum-meet", "body": "คุณเคาะให้ลบ alias solutionsimpact-* แล้วใส่ footer เทาบางๆ ขอข้อความที่แน่นอนเพื่อไม่ต้องเดา", "type": "text", "detailPrompt": "พิมพ์ข้อความ footer ที่ต้องการ (เช่น Research by SolutionsIMPACT · Developed by James Theeranon) และบอกว่าใส่ทั้งสองสกิลหรือตัวเดียว"}]},S={};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));title.textContent=D.title||'Grill Me';round.textContent=`รอบ ${D.round||1} จำนวน ${D.questions.length} คำถาม`;D.questions.forEach((q,i)=>{S[q.id]={selected:[],detail:''};let x=document.createElement('section');x.className='q';x.id='q-'+q.id;let c='';if(q.type==='text')c=`<textarea class="detail" placeholder="${e(q.detailPrompt||'ตอบโดยละเอียด')}"></textarea>`;else{if(q.type==='multi')c='<div class="tools"><button class="all">เลือกทั้งหมด</button><button class="clear">ล้าง</button></div>';c+=`<div class="opts">${q.options.map(o=>`<label class="opt"><input type="${q.type==='single'?'radio':'checkbox'}" name="${e(q.id)}" value="${e(o.id)}"><span><span class="lab">${e(o.label)}</span><div class="desc">${e(o.description||'')}</div></span>${(q.recommended||[]).includes(o.id)?'<span class="rec">แนะนำ</span>':''}</label>`).join('')}</div>`;if(q.detailPrompt)c+=`<textarea class="detail" placeholder="${e(q.detailPrompt)}"></textarea>`}x.innerHTML=`<h2>${i+1}. ${e(q.title)}</h2><div class="body">${e(q.body||'')}</div>${c}`;questions.appendChild(x);let sync=()=>{S[q.id].selected=[...x.querySelectorAll('input:checked')].map(a=>a.value);x.querySelectorAll('.opt').forEach(a=>a.classList.toggle('on',a.querySelector('input').checked));up()};x.addEventListener('change',sync);x.addEventListener('input',a=>{if(a.target.matches('.detail')){S[q.id].detail=a.target.value;up()}});x.querySelector('.all')?.addEventListener('click',()=>{x.querySelectorAll('input').forEach(a=>a.checked=true);sync()});x.querySelector('.clear')?.addEventListener('click',()=>{x.querySelectorAll('input').forEach(a=>a.checked=false);sync()})});let ok=q=>q.type==='text'?S[q.id].detail.trim():S[q.id].selected.length;let result=()=>({title:D.title,round:D.round||1,answers:D.questions.map(q=>({id:q.id,selected:S[q.id].selected,detail:S[q.id].detail.trim()}))});function up(){let n=D.questions.filter(ok).length;fill.style.width=Math.round(n/D.questions.length*100)+'%';status.innerHTML=n===D.questions.length?'<span class="done">ตอบครบแล้ว</span>':`ตอบแล้ว ${n} จาก ${D.questions.length}`;copy.disabled=download.disabled=n!==D.questions.length}up();next.onclick=()=>{let q=D.questions.find(q=>!ok(q))||D.questions[0];document.querySelector('#q-'+q.id).scrollIntoView({behavior:'smooth',block:'center'})};copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(result(),null,2));copy.textContent='คัดลอกแล้ว'};download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result(),null,2)],{type:'application/json'}));a.download='grill-response.json';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
