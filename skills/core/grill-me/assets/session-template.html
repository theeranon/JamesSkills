<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grill Me</title>
<style>:root{--ink:#172033;--muted:#667085;--line:#d8dee8;--soft:#eef1f5;--blue:#2563eb;--tint:#edf3ff;--good:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;line-height:1.4}.shell{max-width:880px;margin:auto;padding:18px}header{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font-size:24px;line-height:1.2;margin:0}.meta,.status{font-size:13px;color:var(--muted)}.bar{height:6px;background:#dce1e8;border-radius:6px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:.2s}.q{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}.q h2{font-size:17px;margin:0 0 4px}.body{font-size:14px;color:#344054;margin-bottom:10px}.opts{display:grid;gap:7px}.opt{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer}.opt:hover{border-color:#8fb0f7}.opt.on{border-color:var(--blue);background:var(--tint)}.opt input{margin-top:3px}.lab{font-weight:600}.desc{font-size:13px;color:var(--muted)}.rec{font-size:11px;color:var(--blue);font-weight:700}.tools,.footer{display:flex;gap:7px}.tools{margin-bottom:8px}button{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 12px;font:inherit;font-weight:600;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}textarea{width:100%;min-height:64px;margin-top:9px;border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;resize:vertical}.footer{position:sticky;bottom:0;background:#eef1f5f2;padding:10px 0;justify-content:flex-end}.status{margin-right:auto;align-self:center}.done{color:var(--good);font-weight:700}@media(max-width:600px){.shell{padding:10px}header{align-items:start;flex-direction:column}.opt{grid-template-columns:22px 1fr}.rec{grid-column:2}.footer{flex-wrap:wrap}.status{width:100%}}</style></head>
<body><main class="shell"><header><div><h1 id="title"></h1><div class="meta" id="round"></div></div><div class="meta">คำตอบอยู่ในเครื่องนี้เท่านั้น</div></header><div class="bar"><i id="fill"></i></div><div id="questions"></div><div class="footer"><span class="status" id="status"></span><button id="next">ข้อที่ยังไม่ตอบ</button><button class="primary" id="copy" disabled>คัดลอกคำตอบ</button><button id="download" disabled>ดาวน์โหลด JSON</button></div></main>
<script>const D=__GRILL_DATA__,S={};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));title.textContent=D.title||'Grill Me';round.textContent=`รอบ ${D.round||1} จำนวน ${D.questions.length} คำถาม`;D.questions.forEach((q,i)=>{S[q.id]={selected:[],detail:''};let x=document.createElement('section');x.className='q';x.id='q-'+q.id;let c='';if(q.type==='text')c=`<textarea class="detail" placeholder="${e(q.detailPrompt||'ตอบโดยละเอียด')}"></textarea>`;else{if(q.type==='multi')c='<div class="tools"><button class="all">เลือกทั้งหมด</button><button class="clear">ล้าง</button></div>';c+=`<div class="opts">${q.options.map(o=>`<label class="opt"><input type="${q.type==='single'?'radio':'checkbox'}" name="${e(q.id)}" value="${e(o.id)}"><span><span class="lab">${e(o.label)}</span><div class="desc">${e(o.description||'')}</div></span>${(q.recommended||[]).includes(o.id)?'<span class="rec">แนะนำ</span>':''}</label>`).join('')}</div>`;if(q.detailPrompt)c+=`<textarea class="detail" placeholder="${e(q.detailPrompt)}"></textarea>`}x.innerHTML=`<h2>${i+1}. ${e(q.title)}</h2><div class="body">${e(q.body||'')}</div>${c}`;questions.appendChild(x);let sync=()=>{S[q.id].selected=[...x.querySelectorAll('input:checked')].map(a=>a.value);x.querySelectorAll('.opt').forEach(a=>a.classList.toggle('on',a.querySelector('input').checked));up()};x.addEventListener('change',sync);x.addEventListener('input',a=>{if(a.target.matches('.detail')){S[q.id].detail=a.target.value;up()}});x.querySelector('.all')?.addEventListener('click',()=>{x.querySelectorAll('input').forEach(a=>a.checked=true);sync()});x.querySelector('.clear')?.addEventListener('click',()=>{x.querySelectorAll('input').forEach(a=>a.checked=false);sync()})});let ok=q=>q.type==='text'?S[q.id].detail.trim():S[q.id].selected.length;let result=()=>({title:D.title,round:D.round||1,answers:D.questions.map(q=>({id:q.id,selected:S[q.id].selected,detail:S[q.id].detail.trim()}))});function up(){let n=D.questions.filter(ok).length;fill.style.width=Math.round(n/D.questions.length*100)+'%';status.innerHTML=n===D.questions.length?'<span class="done">ตอบครบแล้ว</span>':`ตอบแล้ว ${n} จาก ${D.questions.length}`;copy.disabled=download.disabled=n!==D.questions.length}up();next.onclick=()=>{let q=D.questions.find(q=>!ok(q))||D.questions[0];document.querySelector('#q-'+q.id).scrollIntoView({behavior:'smooth',block:'center'})};copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(result(),null,2));copy.textContent='คัดลอกแล้ว'};download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result(),null,2)],{type:'application/json'}));a.download='grill-response.json';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
